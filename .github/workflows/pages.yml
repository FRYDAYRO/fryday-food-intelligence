# Publică aplicația pe GitHub Pages la fiecare push pe main.
# Activare (o singură dată): Settings → Pages → Source: "GitHub Actions".
# După primul push, aplicația e la: https://<utilizator>.github.io/<repo>/
name: Publică pe GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with: { version: 9 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      # --base ./ face căile relative, ca aplicația să meargă sub /nume-repo/
      - run: npx vite build --base ./
      # Politica organizației cere pinning la SHA complet pentru TOATE acțiunile, inclusiv cele
      # apelate intern: `actions/upload-pages-artifact` (compozită) apelează `upload-artifact@v4`
      # nepinuit, deci era refuzată la „Set up job". Facem noi ce făcea ea: arhiva `artifact.tar`
      # din dist, urcată sub numele `github-pages`, exact cum o așteaptă `deploy-pages`.
      - name: Împachetează site-ul pentru Pages
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

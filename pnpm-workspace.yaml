# esbuild e necesar pentru vite și pentru suita de teste, deci îi rulăm scriptul de build.
# Restul sunt dependențe native ale parcel-ului, care nu e folosit de niciun script.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  lmdb: false
  msgpackr-extract: false
onlyBuiltDependencies:
  - esbuild

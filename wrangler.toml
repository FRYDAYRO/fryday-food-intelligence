# Publicare pe Cloudflare, cu poartă de parolă (fără Zero Trust, fără card).
#
# Numele de aici trebuie să fie EXACT numele workerului viu: comenzile `wrangler` îl citesc
# din acest fișier, deci un nume greșit pune secretele pe alt worker, în tăcere, iar aplicația
# rămâne fără ele fără să spună de ce. Publicarea se face automat, din integrarea Git a
# Cloudflare, la fiecare împingere în `main` — `wrangler deploy` e doar pentru urgențe.
#
#   npx wrangler secret put FRYDAY_PAROLA          # parola comună a interfeței
#   npx wrangler secret put FRYDAY_ADMIN_EMAIL     # contul inițial al serverului comun
#   npx wrangler secret put FRYDAY_ADMIN_PAROLA
name = "fryday-food-intelligence"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# Serverul comun: conturi, roluri și starea partajată (vezi worker/api.ts).
# Contul inițial se creează o singură dată, doar dacă ambele secrete există:
#   npx wrangler secret put FRYDAY_ADMIN_EMAIL
#   npx wrangler secret put FRYDAY_ADMIN_PAROLA
[[d1_databases]]
binding = "DB"
database_name = "fryday-fi"
database_id = "722f1437-9a4f-48c8-ab85-9e4da9f7d5dd"
